name: SDK release gates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'packages/**'
      - 'plugins/**'
      - 'native/client/**'
      - 'native/shared/**'
      - 'native/browser/native_aria_*.h'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/sdk-release-gates.yml'

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:browser-control
      - run: pnpm audio-plugins:check
      - run: pnpm typecheck
      - run: pnpm exec vitest run --maxWorkers=2
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:audio-plugin:built
      - run: pnpm test:package:built
      - run: pnpm audit

  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: static
            shared: 'OFF'
            sanitizers: 'OFF'
            configuration: Release
          - mode: shared
            shared: 'ON'
            sanitizers: 'OFF'
            configuration: Release
          - mode: sanitizers
            shared: 'OFF'
            sanitizers: 'ON'
            configuration: Debug
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev zlib1g-dev
      - run: >-
          cmake -S native/client -B build/client
          -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
          -DBUILD_SHARED_LIBS=${{ matrix.shared }}
          -DSUITECUT_CLIENT_SANITIZERS=${{ matrix.sanitizers }}
      - run: cmake --build build/client --parallel 2
      - run: ctest --test-dir build/client --output-on-failure
      - if: matrix.mode == 'sanitizers'
        run: SUITECUT_CLIENT_FUZZ_ITERATIONS=200000 build/client/fuzz_json_decoder_test
      - if: matrix.mode == 'sanitizers'
        run: SUITECUT_AGENT_FUZZ_ITERATIONS=40000 build/client/fuzz_agent_observation_test
      - if: matrix.mode == 'sanitizers'
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:quarantine_size_mb=4:thread_local_quarantine_size_kb=64
        run: |
          cmake -S native/tools -B build/proofs
          cmake --build build/proofs --target suitecut-proof-supervisor --parallel 2
          build/proofs/suitecut-proof-supervisor --report build/session-proof.json --timeout-ms 120000 --cleanup-grace-ms 1000 --physical-ms 6000 -- python3 scripts/fuzz-native-control.py --cli "$PWD/build/client/suitecut-native-control" --engine "$PWD/build/client/simple_agent_test" --iterations 10000 --output build/session-fuzz.json
      - if: matrix.mode != 'sanitizers'
        run: cmake --install build/client --prefix "$PWD/build/sdk"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.mode }}
          path: |
            build/client/Testing/Temporary/LastTest.log
            build/session-proof.json
            build/session-fuzz.json
            build/sdk
