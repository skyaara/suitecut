# Deploys the website to the Cloudflare Pages project `suitecut` when the site
# changes on main. Needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# secrets (see docs/ci.md); without them, or from any other branch, the site is
# only built.
name: Site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://suitecut.aakashreddy.com
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      ON_MAIN: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm site:check
      - run: pnpm site:build
      - name: Skip without Cloudflare credentials
        if: env.HAS_TOKEN != 'true' || env.ON_MAIN != 'true'
        run: |
          if [ "$ON_MAIN" != true ]; then
            echo "::notice::Only main deploys; the site was built but not deployed"
          else
            echo "::warning::CLOUDFLARE_API_TOKEN is not set; the site was built but not deployed"
          fi
      - name: Deploy to Cloudflare Pages
        if: env.HAS_TOKEN == 'true' && env.ON_MAIN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name suitecut --branch main --commit-hash ${{ github.sha }}
