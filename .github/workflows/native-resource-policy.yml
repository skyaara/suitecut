name: Native resource policy

on:
  workflow_dispatch:
  push:
    paths:
      - 'native/resource-policy/**'
      - 'native/browser/worker*'
      - 'native/browser/trace_background*'
      - 'native/browser/locator_handler_async_work.h'
      - 'native/browser/accepted_work_origin.h'
      - 'native/browser/accepted_stream_work.h'
      - '.github/workflows/native-resource-policy.yml'
  pull_request:
    paths:
      - 'native/resource-policy/**'
      - 'native/browser/worker*'
      - 'native/browser/trace_background*'
      - 'native/browser/locator_handler_async_work.h'
      - 'native/browser/accepted_work_origin.h'
      - 'native/browser/accepted_stream_work.h'
      - '.github/workflows/native-resource-policy.yml'

permissions:
  contents: read

jobs:
  resource-policy:
    name: Resource policy on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S native/resource-policy -B build/resource-policy -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/resource-policy --config Release --parallel 2
      - run: ctest --test-dir build/resource-policy -C Release --output-on-failure
