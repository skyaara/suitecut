# Builds, signs, checks and packages a native release, following RELEASING.md.
#
# Pushing a native-v* tag builds every archive and attaches them to a *draft*
# pre-release; a maintainer reviews it and publishes it by hand. Running the
# workflow by hand (or from any branch) builds the same archives as workflow
# artifacts only; only a tag signs for publication and drafts a release.
#
# Secrets (Settings > Secrets and variables > Actions), described in
# docs/ci.md:
#   MACOS_CERTIFICATE_P12, MACOS_CERTIFICATE_PASSWORD  Developer ID Application
#   APPLE_API_KEY_P8, APPLE_API_KEY_ID, APPLE_API_ISSUER_ID  notarization (optional)
name: Release

on:
  push:
    tags: ['native-v*']
  workflow_dispatch:
    inputs:
      notarize:
        description: Notarize the macOS archives (needs the Apple API key secrets)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CMAKE_GENERATOR: Ninja

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: read
        name: Read the version and check the tag
        run: |
          version=$(python3 -c "import sys; sys.path.insert(0, 'scripts'); import suitecut_version; print(suitecut_version.version())")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "native-v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match native/client/CMakeLists.txt ($version)"
            exit 1
          fi

  macos:
    name: macOS arm64 archives
    needs: version
    runs-on: macos-26
    timeout-minutes: 300
    env:
      V: ${{ needs.version.outputs.version }}
      W: ${{ github.workspace }}/.suitecut/release
      SDK: ${{ github.workspace }}/.suitecut/release/cef-official-sdk
      LIBYUV_ROOT: ${{ github.workspace }}/.suitecut/release/libyuv
      KIT_DEPS: ${{ github.workspace }}/.suitecut/release/kit-deps
      MEDIA: ${{ github.workspace }}/.suitecut/release/runtime-ffmpeg
      HAS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
      HAS_NOTARY_KEY: ${{ secrets.APPLE_API_KEY_P8 != '' }}
      WANT_NOTARY: ${{ github.ref_type == 'tag' || inputs.notarize == true }}
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools
        run: brew list ninja >/dev/null 2>&1 || brew install ninja

      - name: Set up code signing
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          API_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [ "$HAS_CERTIFICATE" != true ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              echo "::error::A tagged release needs the MACOS_CERTIFICATE_P12 secret"; exit 1
            fi
            echo "::warning::No signing certificate: the archives are ad-hoc signed and cannot be published"
            echo "SUITECUT_MACOS_SIGN_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          keychain=$RUNNER_TEMP/suitecut-signing.keychain-db
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$keychain"
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | awk '/Developer ID Application/ { print $2; exit }')
          [ -n "$identity" ] || { echo "::error::No Developer ID Application identity in the certificate"; exit 1; }
          echo "SUITECUT_MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          if [ "$WANT_NOTARY" = true ]; then
            if [ "$HAS_NOTARY_KEY" != true ]; then
              echo "::warning::No APPLE_API_KEY_P8 secret: the archives will not be notarized"
              exit 0
            fi
            printf '%s' "$API_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            xcrun notarytool store-credentials suitecut-ci --key "$RUNNER_TEMP/notary.p8" \
              --key-id "$API_KEY_ID" --issuer "$API_ISSUER" --keychain "$keychain"
            rm -f "$RUNNER_TEMP/notary.p8"
            echo "NOTARIZE=--notarize suitecut-ci" >> "$GITHUB_ENV"
          fi

      - name: Cache the CEF SDK
        uses: actions/cache@v4
        with:
          path: ${{ env.SDK }}
          key: cef-macosarm64Official-${{ hashFiles('native/browser/cef-build.json') }}
      - name: Fetch the pinned CEF SDK and libyuv
        run: |
          python3 scripts/fetch-cef-sdk.py --pin macosarm64Official --dest "$SDK"
          commit=$(python3 -c "import json; print(json.load(open('native/browser/libyuv-build.json'))['commit'])")
          git init -q "$LIBYUV_ROOT"
          git -C "$LIBYUV_ROOT" fetch -q --depth=1 https://chromium.googlesource.com/libyuv/libyuv "$commit"
          git -C "$LIBYUV_ROOT" checkout -q --detach FETCH_HEAD
          test "$(git -C "$LIBYUV_ROOT" rev-parse HEAD)" = "$commit"

      # Static OpenSSL, curl, libpsl and Brotli for macOS 14, then the LGPL
      # FFmpeg with its source. Both are rebuilt from scratch for a release.
      - name: Build the static libraries
        run: |
          python3 scripts/build-embed-kit-deps-macos.py fetch --work "$KIT_DEPS"
          python3 scripts/build-embed-kit-deps-macos.py build --work "$KIT_DEPS"
      - name: Build FFmpeg
        run: |
          python3 scripts/build-runtime-ffmpeg-macos.py fetch --work "$MEDIA"
          python3 scripts/build-runtime-ffmpeg-macos.py build --work "$MEDIA" --openssl "$KIT_DEPS/prefix"

      - name: Build the engine
        run: |
          P=$KIT_DEPS/prefix
          cmake -S native/browser -B "$W/engine" -DCMAKE_BUILD_TYPE=Release -DPROJECT_ARCH=arm64 \
            -DCEF_ROOT="$SDK" -DLIBYUV_ROOT="$LIBYUV_ROOT" \
            -DCMAKE_PREFIX_PATH=$P "-DCMAKE_IGNORE_PREFIX_PATH=/opt/homebrew;/usr/local" \
            -DOPENSSL_ROOT_DIR=$P -DOPENSSL_USE_STATIC_LIBS=ON \
            -DSUITECUT_PSL_INCLUDE_DIR=$P/include -DSUITECUT_PSL=$P/lib/libpsl.a \
            -DSUITECUT_BROTLI_INCLUDE_DIR=$P/include \
            -DSUITECUT_BROTLI_DECODER=$P/lib/libsuitecut-brotlidec.a \
            -DSUITECUT_BROTLI_ENCODER=$P/lib/libsuitecut-brotlienc.a \
            -DCMAKE_CXX_FLAGS=-D_LIBCPP_ENABLE_EXPERIMENTAL
          cmake --build "$W/engine" --parallel 3
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$W/engine/suitecut-browser.app/Contents/Info.plist")
          [ "$version" = "$V" ] || { echo "::error::The engine reports $version, not $V"; exit 1; }

      - name: Build, test and install the clients
        run: |
          P=$KIT_DEPS/prefix
          for kind in static shared; do
            extra=()
            [ $kind = shared ] && extra=(-DBUILD_SHARED_LIBS=ON -DCMAKE_INSTALL_RPATH=@loader_path/../lib)
            cmake -S native/client -B "$W/client-$kind" -DCMAKE_BUILD_TYPE=Release \
              -DSUITECUT_CLIENT_BUILD_TESTS=ON -DSUITECUT_CLIENT_BUILD_EXAMPLES=ON -DSUITECUT_CLIENT_BUILD_SESSION=ON \
              -DCMAKE_PREFIX_PATH=$P "-DCMAKE_IGNORE_PREFIX_PATH=/opt/homebrew;/usr/local" \
              -DOPENSSL_ROOT_DIR=$P -DOPENSSL_USE_STATIC_LIBS=ON "${extra[@]}"
            cmake --build "$W/client-$kind" --parallel 3
            ctest --test-dir "$W/client-$kind" -j2 --output-on-failure
            cmake --install "$W/client-$kind" --prefix "$W/sdk-$kind"
          done

      - name: Package the runtime and SDK archives
        run: |
          python3 scripts/package-native-runtime-macos.py --sdk "$W/sdk-static" --kind runtime \
            --app "$W/engine/suitecut-browser.app" --cef official --cef-sdk "$SDK" \
            --ffmpeg "$MEDIA/prefix/bin/ffmpeg" --ffprobe "$MEDIA/prefix/bin/ffprobe" --media-source "$MEDIA" \
            --require-macos 14.0 --output "$W/out/runtime" $NOTARIZE
          python3 scripts/package-native-runtime-macos.py --sdk "$W/sdk-static" --kind static \
            --require-macos 14.0 --output "$W/out/static" $NOTARIZE
          python3 scripts/package-native-runtime-macos.py --sdk "$W/sdk-shared" --kind shared \
            --require-macos 14.0 --output "$W/out/shared" $NOTARIZE
      - name: Verify the runtime from a relocated extraction
        run: |
          python3 scripts/verify-native-runtime-macos.py \
            --archive "$W/out/runtime/SuiteCutRuntime-$V-macos-arm64.tar.gz" \
            --client-build "$W/client-static" --output "$W/proof-runtime"

      - name: Package and verify the embed kit
        run: |
          kit=$W/out/embed-kit/suitecut-embed-kit-$V-macos-arm64
          python3 scripts/package-embed-kit-macos.py package --cef official --cef-sdk "$SDK" \
            --engine-build "$W/engine" --session "$W/client-static/suitecut-session" \
            --deps "$KIT_DEPS" --output "$kit" --replace $NOTARIZE
          python3 scripts/verify-embed-kit-macos.py --kit "$kit" --client-build "$W/client-static" \
            --output "$W/proof-kit"
          sample=$(find "$W/client-static" -name suitecut-embed-sample -type f -perm -u+x | head -1)
          python3 scripts/verify-embed-sample-macos.py --sample "$sample" --runtime "$kit" \
            --output "$W/proof-sample"
          tar -czf "$W/out/embed-kit/suitecut-embed-kit-$V-macos-arm64.tar.gz" -C "$W/out/embed-kit" \
            "suitecut-embed-kit-$V-macos-arm64"

      - name: Collect, check signatures and paths
        run: |
          mkdir -p "$W/public"
          cp "$W/out/runtime/SuiteCutRuntime-$V-macos-arm64.tar.gz" \
            "$W/out/static/SuiteCutClient-$V-macos-arm64-static.tar.gz" \
            "$W/out/shared/SuiteCutClient-$V-macos-arm64-shared.tar.gz" \
            "$W/out/embed-kit/suitecut-embed-kit-$V-macos-arm64.tar.gz" "$W/public/"
          # No archive may name the runner's folders.
          leaks=$(grep -rlaF -e "$HOME" -e "$GITHUB_WORKSPACE" "$W/out" | grep -v '/artifact.json$' | head -20 || true)
          [ -z "$leaks" ] || { echo "::error::Build paths in packaged files"; echo "$leaks"; exit 1; }
          # Every app and executable passes a strict signature check after extraction.
          x=$RUNNER_TEMP/extract
          for archive in "$W"/public/*.tar.gz; do
            rm -rf "$x"; mkdir -p "$x"; tar -xzf "$archive" -C "$x"
            find "$x" -name '*.app' -prune -print0 | xargs -0 -n1 codesign --verify --deep --strict
            find "$x" -type f -perm -u+x -not -path '*.app/*' -print0 | while IFS= read -r -d '' file; do
              if file -b "$file" | grep -q Mach-O; then codesign --verify --strict "$file"; fi
            done
          done
          (cd "$W/public" && shasum -a 256 *.tar.gz > SHA256SUMS-macos && cat SHA256SUMS-macos)

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: ${{ env.W }}/public
          if-no-files-found: error
          retention-days: 30
      - name: Keep the verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-reports
          path: |
            ${{ env.W }}/out/*/artifact.json
            ${{ env.W }}/proof-*/**/*.json
          if-no-files-found: ignore
      - name: Remove the signing keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then security delete-keychain "$SIGNING_KEYCHAIN"; fi

  linux:
    name: Linux x64 SDK archives
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      V: ${{ needs.version.outputs.version }}
      W: ${{ github.workspace }}/.suitecut/release
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libssl-dev zlib1g-dev
      - name: Build, test, install and archive the clients
        run: |
          mkdir -p "$W/public"
          for kind in static shared; do
            extra=()
            [ $kind = shared ] && extra=(-DBUILD_SHARED_LIBS=ON '-DCMAKE_INSTALL_RPATH=$ORIGIN/../lib')
            cmake -S native/client -B "$W/client-$kind" -DCMAKE_BUILD_TYPE=Release \
              -DSUITECUT_CLIENT_BUILD_TESTS=ON -DSUITECUT_CLIENT_BUILD_EXAMPLES=ON \
              -DSUITECUT_CLIENT_BUILD_SESSION=ON "${extra[@]}"
            cmake --build "$W/client-$kind" --parallel 4
            ctest --test-dir "$W/client-$kind" -j2 --output-on-failure
            name=SuiteCutClient-$V-linux-x64-$kind
            cmake --install "$W/client-$kind" --prefix "$W/stage/$name"
            cp LICENSE THIRD_PARTY_NOTICES.md "$W/stage/$name/"
            # The installed SDK builds an outside consumer from a relocated copy.
            cp -R "$W/stage/$name" "$RUNNER_TEMP/$kind prefix"
            cmake -S native/client/tests/consumer -B "$RUNNER_TEMP/consumer-$kind" -DCMAKE_BUILD_TYPE=Release \
              "-DCMAKE_PREFIX_PATH=$RUNNER_TEMP/$kind prefix"
            cmake --build "$RUNNER_TEMP/consumer-$kind"
            ctest --test-dir "$RUNNER_TEMP/consumer-$kind" --output-on-failure
            tar -czf "$W/public/$name.tar.gz" --owner=0 --group=0 --sort=name -C "$W/stage" "$name"
          done
          leaks=$(grep -rlaF -e "$HOME" -e "$GITHUB_WORKSPACE" "$W/stage" | head -20 || true)
          [ -z "$leaks" ] || { echo "::error::Build paths in packaged files"; echo "$leaks"; exit 1; }
          (cd "$W/public" && sha256sum *.tar.gz > SHA256SUMS-linux && cat SHA256SUMS-linux)
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: ${{ env.W }}/public
          if-no-files-found: error
          retention-days: 30

  draft:
    name: Draft the GitHub release
    if: github.ref_type == 'tag'
    needs: [version, macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      V: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the draft pre-release
        run: |
          cd dist
          cat SHA256SUMS-macos SHA256SUMS-linux > SHA256SUMS
          rm SHA256SUMS-macos SHA256SUMS-linux
          sha256sum -c SHA256SUMS
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::A release for $GITHUB_REF_NAME already exists; this workflow only creates new drafts"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --draft --prerelease --verify-tag \
            --title "suitecut $V alpha" --generate-notes ./*.tar.gz SHA256SUMS
