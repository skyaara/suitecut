name: Feature request
description: Propose a focused addition to SuiteCut.
title: '[Feature]: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What recording or rendering job is blocked today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Show the fixture call, CLI command, manifest shape, or output behavior you expect.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CEF engine
        - C++ client SDK and C ABI
        - Control CLI and MCP
        - Embedding (macOS embed kit)
        - Capture, recording and streaming
        - Packaging and signing
        - Documentation
    validations:
      required: true
